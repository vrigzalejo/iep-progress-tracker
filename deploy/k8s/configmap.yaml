apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-progress-tracker
  namespace: iep-progress-tracker
  labels:
    app.kubernetes.io/name: iep-progress-tracker
data:
  AUTH_URL: "https://iep-progress-tracker.example.edu"
  NEXT_PUBLIC_DEMO_MODE: "false"
  NEXT_PUBLIC_APP_NAME: "IEP Progress Tracker"
  NEXT_PUBLIC_APP_SLUG: "iep-progress-tracker"
  POSTGRES_USER: iep
  POSTGRES_DB: iep
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
