# Replace secrets before applying, or create them yourself:
#   kubectl -n iep-progress-tracker create secret generic iep-progress-tracker \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
# Match POSTGRES_USER and POSTGRES_DB in configmap.yaml.
# For a managed database, also set DATABASE_URL (it wins over POSTGRES_*).
apiVersion: v1
kind: Secret
metadata:
  name: iep-progress-tracker
  namespace: iep-progress-tracker
  labels:
    app.kubernetes.io/name: iep-progress-tracker
type: Opaque
stringData:
  AUTH_SECRET: replace-with-openssl-rand-base64-32
  POSTGRES_PASSWORD: replace-with-a-strong-db-password
