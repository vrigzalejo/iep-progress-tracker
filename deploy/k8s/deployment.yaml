apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep-progress-tracker
  namespace: iep-progress-tracker
  labels:
    app.kubernetes.io/name: iep-progress-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iep-progress-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iep-progress-tracker
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: iep-progress-tracker
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: iep-progress-tracker
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: iep-progress-tracker
                  key: POSTGRES_HOST
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: iep-progress-tracker:0.4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 43147
          envFrom:
            - configMapRef:
                name: iep-progress-tracker
            - secretRef:
                name: iep-progress-tracker
          volumeMounts:
            - name: uploads
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 18
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: iep-progress-tracker-uploads
